[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ice-sul"
version = "0.1.0"
description = "Pipeline reproduzível do Índice de Competitividade Econômica do Sul"
requires-python = ">=3.11"

[project.scripts]
ice-sul-municipios = "ice_sul.municipios:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
snapshot = ["pyarrow>=17,<24", "shapely>=2.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
